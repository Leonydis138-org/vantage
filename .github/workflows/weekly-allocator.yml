name: Weekly Allocator

on:
  schedule:
    # Monday 06:00 UTC — matches the cadence in HANDOFF.md Section 4
    - cron: '0 6 * * 1'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab too

jobs:
  allocate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Allocator against live D1
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: node scripts/allocator.mjs
